openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: network
    description: SDN topology and simulation operations
  - name: experiments
    description: Experiment history and execution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /topologies:
    get:
      operationId: getTopologies
      tags: [network]
      summary: List available network topologies
      responses:
        "200":
          description: Available topologies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topology"
  /algorithms:
    get:
      operationId: getAlgorithms
      tags: [network]
      summary: List routing algorithms and baselines
      responses:
        "200":
          description: Available routing algorithms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Algorithm"
  /simulation:
    get:
      operationId: getSimulation
      tags: [network]
      summary: Get the current simulation state
      responses:
        "200":
          description: Current simulation state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
  /simulation/start:
    post:
      operationId: startSimulation
      tags: [network]
      summary: Start a simulation run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulationStartInput"
      responses:
        "200":
          description: Started simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
        "400":
          description: Invalid simulation configuration
  /simulation/stop:
    post:
      operationId: stopSimulation
      tags: [network]
      summary: Stop the current simulation run
      responses:
        "200":
          description: Stopped simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
  /simulation/reset:
    post:
      operationId: resetSimulation
      tags: [network]
      summary: Reset the current simulation run
      responses:
        "200":
          description: Reset simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimulationState"
  /metrics:
    get:
      operationId: getQueueMetrics
      tags: [network]
      summary: Get queue occupancy time series
      parameters:
        - name: windowSeconds
          in: query
          required: false
          schema:
            type: integer
            minimum: 10
            maximum: 600
            default: 120
      responses:
        "200":
          description: Queue occupancy time series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QueueMetricPoint"
  /controller/state:
    get:
      operationId: getControllerState
      tags: [network]
      summary: Get simulated switch, flow-table, port, and queue state
      responses:
        "200":
          description: Controller snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControllerState"
  /controller/queue-rates:
    post:
      operationId: installQueueRate
      tags: [network]
      summary: Install a simulated LS/TS queue-rate split on a switch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueueRateInput"
      responses:
        "200":
          description: Applied queue rates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueRateState"
  /controller/flow-rules:
    post:
      operationId: installFlowRule
      tags: [network]
      summary: Install a simulated flow-table rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowRuleInput"
      responses:
        "200":
          description: Installed simulated flow rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowRule"
  /experiments:
    get:
      operationId: getExperiments
      tags: [experiments]
      summary: List saved experiment runs
      responses:
        "200":
          description: Saved experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Experiment"
  /experiments/run:
    post:
      operationId: runExperiment
      tags: [experiments]
      summary: Run a comparative experiment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExperimentInput"
      responses:
        "200":
          description: Completed experiment summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Experiment"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    TopologyNode:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        x:
          type: number
        y:
          type: number
      required: [id, label, x, y]
    TopologyLink:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        bandwidthMbps:
          type: number
        delayMs:
          type: number
        utilization:
          type: number
      required: [id, source, target, bandwidthMbps, delayMs, utilization]
    Topology:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        nodeCount:
          type: integer
        linkCount:
          type: integer
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyNode"
        links:
          type: array
          items:
            $ref: "#/components/schemas/TopologyLink"
      required: [id, name, description, nodeCount, linkCount, nodes, links]
    Algorithm:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        family:
          type: string
        description:
          type: string
        available:
          type: boolean
      required: [id, name, family, description, available]
    SimulationStartInput:
      type: object
      properties:
        topologyId:
          type: string
        algorithm:
          type: string
        durationSeconds:
          type: integer
          minimum: 10
          maximum: 3600
        seed:
          type: integer
        lsRate:
          type: number
          minimum: 0
          maximum: 100
        tsRate:
          type: number
          minimum: 0
          maximum: 100
      required: [topologyId, algorithm, durationSeconds, seed, lsRate, tsRate]
    SimulationState:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum: [idle, running, stopped, completed]
        topologyId:
          type: string
        algorithm:
          type: string
        elapsedSeconds:
          type: number
        durationSeconds:
          type: integer
        activeFlows:
          type: integer
        averageLatencyMs:
          type: number
        throughputMbps:
          type: number
        packetLossPercent:
          type: number
        updatedAt:
          type: string
          format: date-time
      required: [id, status, topologyId, algorithm, elapsedSeconds, durationSeconds, activeFlows, averageLatencyMs, throughputMbps, packetLossPercent, updatedAt]
    QueueMetricPoint:
      type: object
      properties:
        timestamp:
          type: number
        elapsedSeconds:
          type: number
        switchId:
          type: string
        lsOccupancy:
          type: number
        tsOccupancy:
          type: number
        capacity:
          type: number
      required: [timestamp, elapsedSeconds, switchId, lsOccupancy, tsOccupancy, capacity]
    ControllerQueueState:
      type: object
      properties:
        lsOccupancy:
          type: number
        tsOccupancy:
          type: number
        lsRatePercent:
          type: number
        tsRatePercent:
          type: number
      required: [lsOccupancy, tsOccupancy, lsRatePercent, tsRatePercent]
    FlowRule:
      type: object
      properties:
        switchId:
          type: string
        match:
          type: object
          additionalProperties: true
        actions:
          type: object
          additionalProperties: true
        packets:
          type: integer
      required: [switchId, match, actions, packets]
    ControllerSwitch:
      type: object
      properties:
        switchId:
          type: string
        flowTable:
          type: array
          items:
            $ref: "#/components/schemas/FlowRule"
        queues:
          $ref: "#/components/schemas/ControllerQueueState"
      required: [switchId, flowTable, queues]
    PortState:
      type: object
      properties:
        port:
          type: string
        rxPackets:
          type: integer
        txPackets:
          type: integer
      required: [port, rxPackets, txPackets]
    ControllerState:
      type: object
      properties:
        mode:
          type: string
        switches:
          type: array
          items:
            $ref: "#/components/schemas/ControllerSwitch"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortState"
      required: [mode, switches, ports]
    QueueRateInput:
      type: object
      properties:
        switchId:
          type: string
        lsRatePercent:
          type: number
          minimum: 0
          maximum: 100
      required: [switchId, lsRatePercent]
    QueueRateState:
      type: object
      properties:
        switchId:
          type: string
        lsRatePercent:
          type: number
        tsRatePercent:
          type: number
        mode:
          type: string
      required: [switchId, lsRatePercent, tsRatePercent, mode]
    FlowRuleInput:
      type: object
      properties:
        switchId:
          type: string
        id:
          type: string
        match:
          type: object
          additionalProperties: true
        actions:
          type: object
          additionalProperties: true
      required: [switchId, match, actions]
    ExperimentInput:
      type: object
      properties:
        topologyId:
          type: string
        durationSeconds:
          type: integer
          minimum: 10
          maximum: 3600
        algorithms:
          type: array
          items:
            type: string
          minItems: 1
          maxItems: 8
        seed:
          type: integer
      required: [topologyId, durationSeconds, algorithms, seed]
    Experiment:
      type: object
      properties:
        id:
          type: string
        topologyId:
          type: string
        topologyName:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        algorithms:
          type: array
          items:
            type: string
        durationSeconds:
          type: integer
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        results:
          type: array
          items:
            $ref: "#/components/schemas/ExperimentResult"
      required: [id, topologyId, topologyName, status, algorithms, durationSeconds, createdAt, completedAt, results]
    ExperimentResult:
      type: object
      properties:
        algorithm:
          type: string
        meanLatencyMs:
          type: number
        throughputMbps:
          type: number
        packetLossPercent:
          type: number
        meanQueueOccupancy:
          type: number
      required: [algorithm, meanLatencyMs, throughputMbps, packetLossPercent, meanQueueOccupancy]

